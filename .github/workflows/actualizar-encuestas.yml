# Actualización diaria del simulador, con una persona que aprueba las encuestas nuevas.
#
# Cada mañana, dos trabajos:
#   0. En los dos trabajos, la lista de partida es la APROBADA: la que llegó a main al fusionar un pull request
#      (modelo/lista_aprobada.py). Si datos/polls.csv cambió en main por otra vía —un commit directo—, ese
#      cambio no se usa ni se publica, y se abre un issue «encuestas-sin-aprobar».
#   1. «revisar»: lee la Wikipedia en inglés (anotando la revisión exacta), valida la tabla, la compara con
#      la lista aprobada (datos/polls.csv en main) y comprueba cada encuesta nueva o cambiada con la Wikipedia
#      en español (desde noviembre de 2026; antes era al revés, pero la española se quedó atrás). Si hay cambios, los sube a la rama «encuestas-pendientes» y abre o actualiza un pull request
#      con el detalle. Nada de esto llega a la web hasta que alguien aprueba el pull request (merge).
#   2. «publicar»: recalcula la media y la proyección con la lista aprobada para la fecha del día (las
#      encuestas pierden peso con los días), comprueba los datos, compila y hace commit. Vercel publica cada
#      commit de main.
# Al aprobar el pull request, el push a main con un datos/polls.csv nuevo lanza «publicar» al momento.
#
# Respaldo:
#   - Si Wikipedia falla o devuelve algo raro, no se propone nada y la web sigue con la lista aprobada.
#   - Si falla el cálculo, la comprobación o la compilación, no hay commit: sigue en línea el último día bueno.
#   - En ambos casos se abre (o se comenta) un issue con la etiqueta «fallo-datos». Se cierra solo cuando
#     vuelve a ir bien.
#
# Requisitos del repositorio (una vez):
#   - Settings → Actions → General → Workflow permissions: «Read and write» y «Allow GitHub Actions to create
#     and approve pull requests».
#   - Opcional: variable de repositorio REVISOR (Settings → Secrets and variables → Actions → Variables) con
#     el usuario de GitHub de quien aprueba; se le asigna el pull request y se le pide revisión.
name: Actualizar encuestas

on:
  schedule:
    - cron: '17 7 * * *'     # 07:17 UTC = 08:17 en Madrid en invierno (09:17 en verano)
  workflow_dispatch: {}       # botón «Run workflow» para lanzarlo a mano
  push:                       # al aprobar encuestas (merge del pull request)
    branches: [main]
    paths: [datos/polls.csv]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: actualizar-encuestas
  cancel-in-progress: false

jobs:
  revisar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      estado: ${{ steps.datos.outputs.estado }}
      cambios: ${{ steps.datos.outputs.cambios }}
      motivo: ${{ steps.datos.outputs.motivo }}
    env:
      GH_TOKEN: ${{ github.token }}
      REVISION_MD: /tmp/revision.md        # the pull request body, written by actualizar.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0       # todo el historial: hace falta para encontrar la última lista aprobada
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r modelo/requirements.txt

      - name: Partir de la lista aprobada
        run: python modelo/lista_aprobada.py

      - name: Tests de los lectores de Wikipedia
        run: |
          python modelo/tests/test_fetch_polls.py
          python modelo/tests/test_fetch_en.py

      - name: Leer, validar y comparar con la lista aprobada
        id: datos
        run: python modelo/actualizar.py

      - name: Aviso si no se ha podido leer Wikipedia
        if: steps.datos.outputs.estado == 'respaldo'
        env:
          MOTIVO: ${{ steps.datos.outputs.motivo }}   # texto que viene de Wikipedia: siempre por variable
        run: echo "::warning title=Encuestas no revisadas::$MOTIVO. La web sigue con la lista aprobada."

      - name: Proponer los cambios en un pull request
        if: steps.datos.outputs.estado == 'ok' && steps.datos.outputs.cambios == 'si'
        env:
          MOTIVO: ${{ steps.datos.outputs.motivo }}
          REVISOR: ${{ vars.REVISOR }}
        run: |
          git config user.name "simulador-29n[bot]"
          git config user.email "simulador-29n@users.noreply.github.com"
          git checkout -B encuestas-pendientes
          git add datos/polls.csv datos/fuente.json datos/respaldo
          git commit -m "Encuestas para revisar ($(date -u +%Y-%m-%d)): $MOTIVO"
          git push --force origin encuestas-pendientes
          gh label create revision-encuestas --color 0E8A16 --description "Encuestas nuevas pendientes de aprobar" --force
          TITLE="Encuestas para revisar: $MOTIVO"
          N=$(gh pr list --head encuestas-pendientes --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then
            gh pr edit "$N" --title "$TITLE" --body-file "$REVISION_MD"
          else
            gh pr create --base main --head encuestas-pendientes --title "$TITLE" --body-file "$REVISION_MD" --label revision-encuestas
            N=$(gh pr list --head encuestas-pendientes --state open --json number --jq '.[0].number')
          fi
          if [ -n "$REVISOR" ]; then
            gh pr edit "$N" --add-assignee "$REVISOR" --add-reviewer "$REVISOR" || true
          fi
          echo "Pull request: $(gh pr view "$N" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: revisar
    if: always() && (needs.revisar.result == 'success' || needs.revisar.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sin_aprobar: ${{ steps.aprobada.outputs.sin_aprobar }}
      commits: ${{ steps.aprobada.outputs.commits }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # nunca la propuesta de la rama encuestas-pendientes
          fetch-depth: 0       # todo el historial: hace falta para encontrar la última lista aprobada
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r modelo/requirements.txt

      - name: Usar solo la lista aprobada
        id: aprobada
        run: python modelo/lista_aprobada.py

      - name: Recalcular media y proyección
        run: python modelo/export.py

      - name: Comprobar los datos de la app
        run: python modelo/comprobar.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Construir la página
        working-directory: app
        run: |
          npm ci
          npm run data
          npm run check
          npm run build
          test "$(wc -c < ../index.html)" -gt 300000   # una página vacía o rota pesaría mucho menos

      - name: Commit
        run: |
          git config user.name "simulador-29n[bot]"
          git config user.email "simulador-29n@users.noreply.github.com"
          git add datos/app_data.json app/src/lib/data/app_data.json index.html
          git diff --cached --quiet || git commit -m "Datos del $(date -u +%Y-%m-%d)"
          git checkout -- datos/polls.csv datos/fuente.json   # la lista repuesta no se sube: main queda como estaba
          git pull --rebase origin main
          git push

  avisar:
    needs: [revisar, publicar]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ESTADO: ${{ needs.revisar.outputs.estado }}
      MOTIVO: ${{ needs.revisar.outputs.motivo }}
      REVISAR: ${{ needs.revisar.result }}
      PUBLICAR: ${{ needs.publicar.result }}
      SIN_APROBAR: ${{ needs.publicar.outputs.sin_aprobar }}
      COMMITS: ${{ needs.publicar.outputs.commits }}
    steps:
      - name: Avisar de encuestas sin aprobar en main
        if: needs.publicar.outputs.sin_aprobar == 'si'
        run: |
          gh label create encuestas-sin-aprobar --color D93F0B --description "datos/polls.csv cambió en main sin pull request" --force
          BODY="$(date -u +'%Y-%m-%d %H:%M UTC') — datos/polls.csv ha cambiado en main sin pasar por un pull request (commits: $COMMITS). La web NO usa esos cambios: sigue con la última lista aprobada. Para usarlos, propónlos en un pull request, o deshaz el commit.
          Ejecución: $RUN_URL"
          N=$(gh issue list --label encuestas-sin-aprobar --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "Encuestas en main sin aprobar" --label encuestas-sin-aprobar --body "$BODY"; fi
      - name: Cerrar el aviso de encuestas sin aprobar
        if: needs.publicar.result == 'success' && needs.publicar.outputs.sin_aprobar == 'no'
        run: |
          for N in $(gh issue list --label encuestas-sin-aprobar --state open --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Resuelto: datos/polls.csv en main vuelve a ser la lista aprobada. $RUN_URL"
          done
      - name: Abrir o comentar el issue de fallo
        if: needs.revisar.result == 'failure' || needs.publicar.result == 'failure' || needs.revisar.outputs.estado == 'respaldo'
        run: |
          gh label create fallo-datos --color B60205 --description "La actualización diaria no ha ido bien" --force
          if [ "$ESTADO" = "respaldo" ]; then
            MSG="No se ha podido leer o validar Wikipedia, así que no se proponen encuestas nuevas; la web sigue con la lista aprobada. Motivo: $MOTIVO"
          elif [ "$REVISAR" = "failure" ]; then
            MSG="Ha fallado la revisión de encuestas (tests, lectura o pull request); la web sigue con la lista aprobada."
          else
            MSG="Ha fallado el cálculo, la comprobación o la compilación; no se ha hecho commit y la página en línea sigue siendo la del último día correcto."
          fi
          BODY="$(date -u +'%Y-%m-%d %H:%M UTC') — $MSG
          Ejecución: $RUN_URL"
          N=$(gh issue list --label fallo-datos --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "La actualización diaria del simulador ha fallado" --label fallo-datos --body "$BODY"; fi
      - name: Cerrar el issue si todo ha ido bien
        if: needs.publicar.result == 'success' && needs.revisar.result != 'failure' && needs.revisar.outputs.estado != 'respaldo'
        run: |
          for N in $(gh issue list --label fallo-datos --state open --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Resuelto: la actualización del $(date -u +%Y-%m-%d) ha funcionado. $RUN_URL"
          done
