 demoscópicas que acertaron en 2023, corrige el sesgo de cada empresa y reparte el resultado por provincias según dónde ha sido más fuerte o más débil cada partido en las tres últimas generales. Después, D'Hondt reparte los escaños. Las encuestas se recogen cada día, de forma automática, de la recopilación de sondeos publicados que mantiene Wikipedia.</p> <div class="cwrap svelte-tl4its"><div class="scrollx"><svg class="chart svelte-tl4its" style="min-width:560px" role="img" aria-label="Evolución de la media de encuestas"><!><!><!><!><!><!><!></svg></div> <!></div> <p class="method">Líneas: media ajustada semana a semana con los datos disponibles en cada fecha. Puntos: cada encuesta publicada, sin ajustar. % de voto válido.</p> <div class="scrollx"><table class="ptable svelte-tl4its"><thead><tr><th class="svelte-tl4its">Empresa demoscópica / medio</th><th class="svelte-tl4its">Campo</th><th class="svelte-tl4its">Muestra</th><th class="svelte-tl4its">PP</th><th class="svelte-tl4its">PSOE</th><th class="svelte-tl4its">Vox</th><th class="svelte-tl4its">Sumar/FA</th><th class="svelte-tl4its">Podemos</th><th class="svelte-tl4its">SALF</th><th style="text-align:left" class="svelte-tl4its">Peso hoy</th></tr></thead><tbody></tbody></table></div> <section class="meth svelte-tl4its"><h3 class="hd">Cómo se calcula <strong>la proyección</strong></h3> <div class="prose svelte-tl4its"><p class="svelte-tl4its"><b>Media de encuestas.</b> </p> <p class="svelte-tl4its"><b>Valoración de las empresas demoscópicas.</b> Error medio absoluto de su último sondeo antes del 23J de 2023 en PP, PSOE, Vox y Sumar, convertido en un multiplicador entre 0,6 y 1,4. Las empresas sin historial reciben 0,85. Se incluyen la estimación del CIS y las reestimaciones de sus microdatos que publican otras empresas; como salen de la misma encuesta, comparten un solo peso.</p> <p class="svelte-tl4its"><b>Sesgo de cada empresa.</b> Cada encuesta se compara con la media de las demás empresas demoscópicas en ±21 días; la desviación media de cada empresa, encogida hacia cero según el número de sondeos, se resta antes de promediar.</p> <p class="svelte-tl4its"><b>De España a las provincias.</b> Para cada partido se calcula su fuerza relativa en cada circunscripción (su porcentaje allí dividido por su porcentaje nacional) en las generales de julio de 2023 (peso 0,6), noviembre de 2019 (0,25) y abril de 2019 (0,15). Si un partido no se presentó en una provincia un año concreto, ese año no cuenta (por ejemplo, Vox en Santa Cruz de Tenerife en 2023). Un ajuste proporcional iterativo hace que la suma de provincias reproduzca la media nacional. Frente Amplio y Compromís heredan el perfil de Sumar, Unidas Podemos y Más País; Podemos, el de Unidas Podemos en 2019. SALF, Aliança Catalana y Adelante Andalucía no tienen historial en generales y usan perfiles supuestos (SALF, mitad uniforme y mitad el de Vox; Aliança, uniforme en Cataluña; Adelante, ponderado hacia Cádiz y Sevilla).</p> <p class="svelte-tl4its"><b>Censo y escaños.</b> </p> <p class="svelte-tl4its"><b>Tus controles.</b> Los deslizadores mueven votos, no escaños. Un cambio nacional se reparte entre provincias de forma proporcional al voto que el partido ya tiene en cada una y el resto de partidos cede votos en proporción a su tamaño. Un cambio provincial solo afecta a esa provincia. La participación añade o quita votantes, que se reparten como el resto salvo que cambies el reparto. Después, D'Hondt asigna los escaños en cada circunscripción.</p> <p class="svelte-tl4its"><b>La transferencia de voto.</b> Para cada circunscripción, cada opción de 2023 conserva todo el voto que puede (Sumar pasa a Frente Amplio, Compromís y Podemos); lo que pierde se reparte entre las que crecen, en proporción a lo que crecen, y la abstención cierra la cuenta sobre el censo de 2026. Es el trasvase mínimo compatible con los dos resultados, no una medición.</p> <p class="svelte-tl4its">Es una calculadora de supuestos, no un pronóstico: no estima incertidumbre ni probabilidades.</p> <p class="src svelte-tl4its"><b>Fuentes.</b> Resultados de las generales de abril y noviembre de 2019 y julio de 2023: <a href="https://infoelectoral.interior.gob.es" target="_blank" rel="noopener" class="svelte-tl4its">Ministerio del Interior</a>. Encuestas: <a href="https://es.wikipedia.org/wiki/Encuestas_de_opini%C3%B3n_para_las_elecciones_generales_de_Espa%C3%B1a_de_2026" target="_blank" rel="noopener" class="svelte-tl4its">recopilación de Wikipedia</a> de los sondeos publicados (empresas demoscópicas, medios y <a href="https://www.cis.es" target="_blank" rel="noopener" class="svelte-tl4its">CIS</a> <a href="https://github.com/martgnz/es-atlas" target="_blank" rel="noopener" class="svelte-tl4its">es-atlas</a> (Instituto Geográfico Nacional); cartograma de hexágonos a partir del de El Confidencial.</p></div></section>`,1);function uD(e,t){ee(t,!0);const n=["PP","PSOE","VOX","SUMAR","PODEMOS","SALF"],r=k=>k==="SUMAR"?k1.FA.c:k1[k].c,i=k=>k==="SUMAR"?"Sumar / FA + Compromís":k1[k].n,L=760,a=300,o={l:34,r:196,t:12,b:26},s=$e.series,c=new Date(s[0].d).getTime(),f=new Date($e.today).getTime(),u=k=>o.l+(new Date(k).getTime()-c)/(f-c)*(L-o.l-o.r),l=k=>o.t+(1-k/40)*(a-o.t-o.b),d=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],p=[];for(let k=new Date(2025,10,1);k<=new Date($e.today);k.setMonth(k.getMonth()+1))p.push({x:u(k.toISOString().slice(0,10)),t:d[k.getMonth()]+(k.getMonth()===0?" 26":"")});const g=$e.polls.filter(k=>new Date(k.end).getTime()>=c).flatMap(k=>n.filter(W=>k.v[W]!=null).map(W=>({x:u(k.end),y:l(k.v[W]),c:r(W),k:W,p:k}))),v=n.map(k=>({k,d:s.map((W,p1)=>(p1?"L":"M")+u(W.d).toFixed(1)+","+l(W[k]).toFixed(1)).join("")})),S=s[s.length-1],m=n.map(k=>({k,y:l(S[k]),v:S[k]})).sort((k,W)=>k.y-W.y);for(let k=1;k<m.length;k++)m[k].y-m[k-1].y<15&&(m[k].y=m[k-1].y+15);let y,P=F1(null),_=F1(R4({x:0,y:0,left:!0}));function M(k){const W=y.getScreenCTM();if(!W)return;const p1=new DOMPoint(k.clientX,k.clientY)
