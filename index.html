elte-tl4its"><thead><tr><th class="svelte-tl4its">Empresa demoscópica / medio</th><th class="svelte-tl4its">Campo</th><th class="svelte-tl4its">Muestra</th><th class="svelte-tl4its">PP</th><th class="svelte-tl4its">PSOE</th><th class="svelte-tl4its">Vox</th><th class="svelte-tl4its">Sumar/FA</th><th class="svelte-tl4its">Podemos</th><th class="svelte-tl4its">SALF</th><th style="text-align:left" class="svelte-tl4its">Peso hoy</th></tr></thead><tbody></tbody></table></div> <section class="meth w svelte-tl4its"><h3 class="hd">Cómo se calcula <strong>la proyección</strong></h3> <div class="prose svelte-tl4its"><p class="svelte-tl4its"><b>Media de encuestas.</b> </p> <p class="svelte-tl4its"><b>Valoración de las empresas demoscópicas.</b> Error medio absoluto de su último sondeo antes del 23J de 2023 en PP, PSOE, Vox y Sumar, convertido en un multiplicador entre 0,6 y 1,4. Las empresas sin historial reciben 0,85. Se incluyen la estimación del CIS y las reestimaciones de sus microdatos que publican otras empresas; como salen de la misma encuesta, comparten un solo peso.</p> <p class="svelte-tl4its"><b>Sesgo de cada empresa.</b> Cada encuesta se compara con la media de las demás empresas demoscópicas en ±21 días; la desviación media de cada empresa, encogida hacia cero según el número de sondeos, se resta antes de promediar.</p> <p class="svelte-tl4its"><b>De España a las provincias.</b> Para cada partido se calcula su fuerza relativa en cada circunscripción (su porcentaje allí dividido por su porcentaje nacional) en las generales de julio de 2023 (peso 0,6), noviembre de 2019 (0,25) y abril de 2019 (0,15). Si un partido no se presentó en una provincia un año concreto, ese año no cuenta (por ejemplo, Vox en Santa Cruz de Tenerife en 2023). Un ajuste proporcional iterativo hace que la suma de provincias reproduzca la media nacional. Frente Amplio y Compromís heredan el perfil de Sumar, Unidas Podemos y Más País; Podemos, el de Unidas Podemos en 2019. SALF, Aliança Catalana y Adelante Andalucía no tienen historial en generales y usan perfiles supuestos (SALF, mitad uniforme y mitad el de Vox; Aliança, uniforme en Cataluña; Adelante, ponderado hacia Cádiz y Sevilla).</p> <p class="svelte-tl4its"><b>Censo y escaños.</b> </p> <p class="svelte-tl4its"><b>La transferencia de voto.</b> Para cada circunscripción, cada opción de 2023 conserva todo el voto que puede (Sumar pasa a Frente Amplio, Compromís y Podemos); lo que pierde se reparte entre las que crecen, en proporción a lo que crecen, y la abstención cierra la cuenta sobre el censo de 2026. Es el trasvase mínimo compatible con los dos resultados, no una medición.</p> <p class="svelte-tl4its">La proyección no es un pronóstico: refleja lo que dicen hoy las encuestas y no estima incertidumbre ni probabilidades.</p> <p class="src svelte-tl4its"><b>Fuentes.</b> Resultados de las generales de abril y noviembre de 2019 y julio de 2023: <a href="https://infoelectoral.interior.gob.es" target="_blank" rel="noopener" class="svelte-tl4its">Ministerio del Interior</a>. Encuestas: <a href="https://es.wikipedia.org/wiki/Encuestas_de_opini%C3%B3n_para_las_elecciones_generales_de_Espa%C3%B1a_de_2026" target="_blank" rel="noopener" class="svelte-tl4its">recopilación de Wikipedia</a> de los sondeos publicados (empresas demoscópicas, medios y <a href="https://www.cis.es" target="_blank" rel="noopener" class="svelte-tl4its">CIS</a> <a href="https://github.com/martgnz/es-atlas" target="_blank" rel="noopener" class="svelte-tl4its">es-atlas</a> (Instituto Geográfico Nacional); cartograma de hexágonos a partir del de El Confidencial.</p></div></section>`,1);function ND(e,t){te(t,!0);const n=["PP","PSOE","VOX","SUMAR","PODEMOS","SALF"],r=Q=>Q==="SUMAR"?B1.FA.c:B1[Q].c,i=Q=>Q==="SUMAR"?"Sumar / FA + Compromís":B1[Q].n;let L=x1(760);const a=f1(()=>Math.max(560,Math.round(h(L)))),o=340,s={l:34,r:196,t:12,b:26},c=Oe.series,l=new Date(c[0].d).getTime(),u=new Date(Oe.today).getTime(),f=f1(()=>Q=>s.l+(new Date(Q).getTi
