historial en generales y usan perfiles supuestos (SALF, mitad uniforme y mitad el de Vox; Aliança, uniforme en Cataluña; Adelante, ponderado hacia Cádiz y Sevilla).</p> <p class="svelte-tl4its"><b>Censo y escaños.</b> </p> <p class="svelte-tl4its"><b>La transferencia de voto.</b> Para cada circunscripción, cada opción de 2023 conserva todo el voto que puede (Sumar pasa a Frente Amplio, Compromís y Podemos); lo que pierde se reparte entre las que crecen, en proporción a lo que crecen, y la abstención cierra la cuenta sobre el censo de 2026. Es el trasvase mínimo compatible con los dos resultados, no una medición.</p> <p class="svelte-tl4its">La proyección no es un pronóstico: refleja lo que dicen hoy las encuestas y no estima incertidumbre ni probabilidades.</p> <p class="src svelte-tl4its"><b>Fuentes.</b> Resultados de las generales de abril y noviembre de 2019 y julio de 2023: <a href="https://infoelectoral.interior.gob.es" target="_blank" rel="noopener" class="svelte-tl4its">Ministerio del Interior</a>. Encuestas: <a href="https://es.wikipedia.org/wiki/Encuestas_de_opini%C3%B3n_para_las_elecciones_generales_de_Espa%C3%B1a_de_2026" target="_blank" rel="noopener" class="svelte-tl4its">recopilación de Wikipedia</a> de los sondeos publicados (empresas demoscópicas, medios y <a href="https://www.cis.es" target="_blank" rel="noopener" class="svelte-tl4its">CIS</a> <a href="https://github.com/martgnz/es-atlas" target="_blank" rel="noopener" class="svelte-tl4its">es-atlas</a> (Instituto Geográfico Nacional); cartograma de hexágonos a partir del de El Confidencial.</p></div></section>`,1);function zD(e,t){Le(t,!0);const n=["PP","PSOE","VOX","SUMAR","PODEMOS","SALF"],r=F=>F==="SUMAR"?z1.FA.c:z1[F].c,i=F=>F==="SUMAR"?"Sumar / FA + Compromís":z1[F].n;let a=C1(760);const L=s1(()=>Math.max(560,Math.round(h(a)))),o=340,s={l:34,r:196,t:12,b:26},c=Ue.series,l=new Date(c[0].d).getTime(),u=new Date(Ue.today).getTime(),f=s1(()=>F=>s.l+(new Date(F).getTime()-l)/(u-l)*(h(L)-s.l-s.r)),d
